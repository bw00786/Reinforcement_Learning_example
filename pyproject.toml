[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alien-garden"
version = "0.1.0"
description = "Cooperative MAPPO alien garden simulation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
alien-garden = "alien_garden.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
